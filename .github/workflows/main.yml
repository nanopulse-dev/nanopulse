name: CI
on:
  push:
    branches:
      - '*'
    tags:
      - 'v*'
  pull_request:

env:
  CARGO_INCREMENTAL: 0

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      -
        name: Remove pre-installed software
        run: |
          echo "Before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet \
                       /usr/local/lib/android \
                       /opt/ghc \
                       /usr/local/share/boost \
                       "$AGENT_TOOLSDIRECTORY"
          echo "After cleanup:"
          df -h
      -
        name: Checkout
        uses: actions/checkout@v7
      - 
        name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-26.05
      -
        name: Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
      -
        name: Install dev dependencies
        run: nix-shell --command "just install-dev-dependencies"
      -
        name: Run tests
        run: nix-shell --command "just test"
