name: CI
on:
  push:
    branches:
      - '*'
    tags:
      - 'v*'
  pull_request:

env:
  CARGO_INCREMENTAL: 0

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      -
        name: Remove pre-installed software
        run: |
          echo "Before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet \
                       /usr/local/lib/android \
                       /opt/ghc \
                       /usr/local/share/boost \
                       "$AGENT_TOOLSDIRECTORY"
          echo "After cleanup:"
          df -h
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cache/mise/downloads-cas
            target/
          key: ${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('mise.lock') }}
      - uses: jdx/mise-action@v5
        with:
          cache: false
      -
        name: Run tests
        run: mise run test
