[package]
  name = "rak11162"
  version = "0.1.0"
  license = "Apache-2.0"
  edition = "2024"
  publish = false

[dependencies]
  nanopulse = { path = "../../../nanopulse" }
  nanopulse-device = { path = "../../../nanopulse-device/", features = [
    "lora_sx126x",
  ] }

  defmt = "1.1"
  defmt-rtt = "1.1"
  heapless = "0.9"

  embedded-hal = "1.0"
  embedded-hal-async = "1.0"
  embedded-io = "0.7"
  embedded-io-async = "0.7"
  embedded-storage = "0.3"

  embassy-executor = { version = "0.10", features = ["defmt"] }
  embassy-sync = { version = "0.8" }
  embassy-time = { version = "0.5", features = [
    "defmt",
    "defmt-timestamp-uptime",
    "tick-hz-32_768",
  ] }
  embassy-stm32 = { version = "0.6", features = [
    "defmt",
    "stm32wle5cc",
    "time-driver-any",
    "unstable-pac",
    "low-power",
    "gpio-init-analog",
    "executor-thread",
  ] }
  cortex-m = { version = "0.7", features = [
    "inline-asm",
    "critical-section-single-core",
  ] }
  cortex-m-rt = "0.7"
  panic-probe = { version = "1.0.0", features = ["print-defmt"] }

[profile.release]
  debug = true
  strip = false
